<style>

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;header&gt;&lt;h1&gt;Transformation Visualizer&lt;/h1&gt;&lt;p&gt;Galawin ang sliders, i-drag ang shape, o mag-challenge. Tingnan kung paano nabubuo ang matrix.&lt;/p&gt;&lt;/header&gt;
&lt;div class=&quot;layout&quot;&gt;
&lt;section class=&quot;stage&quot;&gt;
  &lt;canvas id=&quot;cv&quot; aria-label=&quot;Coordinate plane with original and transformed shape&quot;&gt;&lt;/canvas&gt;

  &lt;div class=&quot;chips&quot; id=&quot;chips&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;goal&quot; id=&quot;goalmsg&quot;&gt;&lt;/p&gt;&lt;p class=&quot;sum&quot; id=&quot;sum&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/section&gt;
&lt;div class=&quot;panel&quot;&gt;
  &lt;section class=&quot;card op&quot; style=&quot;--c:var(--cT)&quot;&gt;&lt;h2&gt;Move &lt;button data-reset=&quot;T&quot;&gt;Reset&lt;/button&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;X&lt;/span&gt;&lt;input id=&quot;tx&quot; type=&quot;range&quot; min=&quot;-6&quot; max=&quot;6&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;Y&lt;/span&gt;&lt;input id=&quot;ty&quot; type=&quot;range&quot; min=&quot;-6&quot; max=&quot;6&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;card op&quot; style=&quot;--c:var(--cS)&quot;&gt;&lt;h2&gt;Scale &lt;button data-reset=&quot;S&quot;&gt;Reset&lt;/button&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;X&lt;/span&gt;&lt;input id=&quot;sx&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;Y&lt;/span&gt;&lt;input id=&quot;sy&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;label class=&quot;sw&quot; style=&quot;margin:0&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;lock&quot; checked&gt; Keep X and Y equal&lt;/label&gt;&lt;/section&gt;
  &lt;section class=&quot;card op&quot; style=&quot;--c:var(--cH)&quot;&gt;&lt;h2&gt;Shear &lt;button data-reset=&quot;H&quot;&gt;Reset&lt;/button&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;X&lt;/span&gt;&lt;input id=&quot;hx&quot; type=&quot;range&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;Y&lt;/span&gt;&lt;input id=&quot;hy&quot; type=&quot;range&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;card op&quot; style=&quot;--c:var(--cR)&quot;&gt;&lt;h2&gt;Rotate &lt;button data-reset=&quot;R&quot;&gt;Reset&lt;/button&gt;&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span&gt;°&lt;/span&gt;&lt;input id=&quot;r&quot; type=&quot;range&quot; min=&quot;-360&quot; max=&quot;360&quot; step=&quot;1&quot;&gt;&lt;output&gt;&lt;/output&gt;&lt;/div&gt;&lt;/section&gt;

  &lt;section class=&quot;card&quot;&gt;
    &lt;h3 style=&quot;margin-top:0&quot;&gt;Choose object&lt;/h3&gt;
    &lt;div class=&quot;tiles&quot; id=&quot;tiles&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;g2&quot;&gt;
      &lt;select id=&quot;shape&quot; aria-label=&quot;Shape&quot;&gt;&lt;option value=&quot;F&quot;&gt;Shape: F&lt;/option&gt;&lt;option value=&quot;sq&quot;&gt;Shape: Square&lt;/option&gt;&lt;option value=&quot;tri&quot;&gt;Shape: Triangle&lt;/option&gt;&lt;option value=&quot;arrow&quot;&gt;Shape: Arrow&lt;/option&gt;&lt;option value=&quot;house&quot;&gt;Shape: House&lt;/option&gt;&lt;option value=&quot;star&quot;&gt;Shape: Star&lt;/option&gt;&lt;option value=&quot;L&quot;&gt;Shape: L&lt;/option&gt;&lt;option value=&quot;custom&quot;&gt;Shape: My drawing&lt;/option&gt;&lt;/select&gt;
      &lt;button id=&quot;draw&quot;&gt;✎ Draw own shape&lt;/button&gt;
      &lt;select id=&quot;pivot&quot; aria-label=&quot;Pivot&quot;&gt;&lt;option value=&quot;o&quot;&gt;Pivot: Origin (0,0)&lt;/option&gt;&lt;option value=&quot;c&quot;&gt;Pivot: Shape center&lt;/option&gt;&lt;option value=&quot;x&quot;&gt;Pivot: Custom (drag red dot)&lt;/option&gt;&lt;/select&gt;
      &lt;select id=&quot;order&quot; aria-label=&quot;Order of operations&quot;&gt;&lt;/select&gt;
    &lt;/div&gt;
    &lt;h3&gt;Quick presets&lt;/h3&gt;&lt;div class=&quot;chips&quot; id=&quot;presets&quot; style=&quot;margin-top:0&quot;&gt;&lt;/div&gt;
    &lt;h3&gt;Challenge&lt;/h3&gt;
    &lt;div class=&quot;g2&quot;&gt;&lt;select id=&quot;lvl&quot; aria-label=&quot;Level&quot;&gt;&lt;option value=&quot;1&quot;&gt;Easy: move only&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;Medium: move + rotate&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;Hard: move + rotate + scale&lt;/option&gt;&lt;/select&gt;
    &lt;button id=&quot;chal&quot;&gt;🎯 Start challenge&lt;/button&gt;&lt;/div&gt;
    &lt;p class=&quot;hint&quot;&gt;Itugma ang asul na shape sa berdeng outline.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;card&quot;&gt;
    &lt;h3 style=&quot;margin-top:0&quot;&gt;Combined matrix M&lt;/h3&gt;
    &lt;div class=&quot;f&quot; id=&quot;formula&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mm big&quot; id=&quot;mat&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;hint&quot;&gt;[x′ y′ 1]ᵀ = M · [x y 1]ᵀ. Ang unang operation ay nasa pinakakanan.&lt;/p&gt;
    &lt;details&gt;&lt;summary&gt;Matrix math, step by step&lt;/summary&gt;&lt;div id=&quot;math&quot; style=&quot;margin-top:8px&quot;&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;details&gt;&lt;summary&gt;Vertex coordinates&lt;/summary&gt;&lt;table id=&quot;tbl&quot;&gt;&lt;/table&gt;&lt;/details&gt;
    &lt;div class=&quot;g2&quot; style=&quot;margin-top:12px&quot;&gt;&lt;button id=&quot;png&quot;&gt;⬇ Save PNG&lt;/button&gt;&lt;button id=&quot;copy&quot;&gt;⧉ Copy matrix&lt;/button&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;card&quot;&gt;
    &lt;h3 style=&quot;margin-top:0&quot;&gt;Your own matrix&lt;/h3&gt;
    &lt;label class=&quot;sw&quot; style=&quot;margin:0 0 8px&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;usemat&quot;&gt; Use this instead of the sliders&lt;/label&gt;
    &lt;div class=&quot;mg&quot; id=&quot;mg&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;g2&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button id=&quot;fill&quot;&gt;Copy current M here&lt;/button&gt;&lt;/div&gt;
    &lt;p class=&quot;hint&quot;&gt;Last row ay laging 0 0 1. Subukan: a=1, b=1 para sa shear.&lt;/p&gt;
  &lt;/section&gt;
&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;script&gt;
const $=id=&gt;document.getElementById(id);
const OFF=[2,1],NAME={S:&#x27;Scale&#x27;,H:&#x27;Shear&#x27;,R:&#x27;Rotate&#x27;,T:&#x27;Move&#x27;,M:&#x27;Matrix&#x27;};
const SHAPES={
  F:[[-1,-1.5],[-.4,-1.5],[-.4,-.2],[.5,-.2],[.5,.3],[-.4,.3],[-.4,.8],[.8,.8],[.8,1.5],[-1,1.5]],
  sq:[[-1,-1],[1,-1],[1,1],[-1,1]],tri:[[-1,-1],[1,-1],[0,1.3]],
  arrow:[[-1.2,-.4],[.3,-.4],[.3,-1],[1.3,0],[.3,1],[.3,.4],[-1.2,.4]]};
SHAPES.house=[[-1,-1],[1,-1],[1,.4],[0,1.4],[-1,.4]];
SHAPES.star=[...Array(10)].map((_,i)=&gt;{const a=Math.PI/2+i*Math.PI/5,r=i%2?.55:1.3;return[r*Math.cos(a),r*Math.sin(a)]});
SHAPES.L=[[-1,-1.2],[1,-1.2],[1,-.2],[-.1,-.2],[-.1,1.2],[-1,1.2]];
for(const k in SHAPES)SHAPES[k]=SHAPES[k].map(v=&gt;[v[0]+OFF[0],v[1]+OFF[1]]);
const ID={tx:0,ty:0,sx:1,sy:1,hx:0,hy:0,r:0};
const PRESETS=[[&#x27;Flip left–right&#x27;,{sx:-1,sy:1}],[&#x27;Flip up–down&#x27;,{sx:1,sy:-1}],[&#x27;Turn 90°&#x27;,{r:90}],[&#x27;Double&#x27;,{sx:2,sy:2}],[&#x27;Half&#x27;,{sx:.5,sy:.5}],[&#x27;Shear →&#x27;,{hx:.6}]];
const perms=s=&gt;s.length&lt;2?[s]:[...s].flatMap((c,i)=&gt;perms(s.slice(0,i)+s.slice(i+1)).map(p=&gt;c+p));
const cv=$(&#x27;cv&#x27;),ctx=cv.getContext(&#x27;2d&#x27;),ids=Object.keys(ID);
let P={...ID,tx:1,ty:-2,sx:1.3,sy:1.3,r:30},prog=null,raf=null,goal=null,drawing=false,cust=[],cp=[0,0];
const col=c=&gt;getComputedStyle(document.documentElement).getPropertyValue(c).trim();
const clamp=(v,a,b)=&gt;Math.min(b,Math.max(a,v));
const mul=(A,B)=&gt;A.map((_,i)=&gt;B[0].map((_,j)=&gt;A[i][0]*B[0][j]+A[i][1]*B[1][j]+A[i][2]*B[2][j]));
const Tm=(x,y)=&gt;[[1,0,x],[0,1,y],[0,0,1]],I3=()=&gt;Tm(0,0);
const apply=(M,v)=&gt;[M[0][0]*v[0]+M[0][1]*v[1]+M[0][2],M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]];
const fmt=n=&gt;(Math.abs(n)&lt;.005?0:n).toFixed(2);
const useMat=()=&gt;$(&#x27;usemat&#x27;).checked;
const ordArr=()=&gt;useMat()?[&#x27;M&#x27;]:[...$(&#x27;order&#x27;).value];
const pivot=()=&gt;{const m=$(&#x27;pivot&#x27;).value;return m===&#x27;o&#x27;?[0,0]:m===&#x27;c&#x27;?OFF:cp};
const base=()=&gt;{const s=$(&#x27;shape&#x27;).value;return s===&#x27;custom&#x27;?(cust.length&gt;=3?cust:SHAPES.F):SHAPES[s]};
const userMat=()=&gt;{const v=[...document.querySelectorAll(&#x27;.mi&#x27;)].map(i=&gt;+i.value||0);return[[v[0],v[1],v[2]],[v[3],v[4],v[5]],[0,0,1]]};
function mats(p){
  const a=p.r*Math.PI/180,c=Math.cos(a),s=Math.sin(a),[qx,qy]=pivot(),ab=M=&gt;mul(Tm(qx,qy),mul(M,Tm(-qx,-qy)));
  return{T:Tm(p.tx,p.ty),S:ab([[p.sx,0,0],[0,p.sy,0],[0,0,1]]),H:ab([[1,p.hx,0],[p.hy,1,0],[0,0,1]]),R:ab([[c,-s,0],[s,c,0],[0,0,1]])};
}
function stages(p){
  if(useMat()){const M=userMat();return[{ch:&#x27;M&#x27;,M,op:M,prev:I3()}]}
  const m=mats(p);let M=I3();
  return[...$(&#x27;order&#x27;).value].map(ch=&gt;{const prev=M;M=mul(m[ch],M);return{ch,M,op:m[ch],prev}});
}
function view(){
  if(prog===null)return P;
  const q={...ID};
  ordArr().forEach((ch,k)=&gt;{const f=clamp(prog-k,0,1);
    if(ch===&#x27;T&#x27;){q.tx=P.tx*f;q.ty=P.ty*f}
    if(ch===&#x27;S&#x27;){q.sx=1+(P.sx-1)*f;q.sy=1+(P.sy-1)*f}
    if(ch===&#x27;H&#x27;){q.hx=P.hx*f;q.hy=P.hy*f}
    if(ch===&#x27;R&#x27;)q.r=P.r*f});
  return q;
}
function fit(){const d=devicePixelRatio||1,w=cv.clientWidth;cv.width=w*d;cv.height=w*d;ctx.setTransform(d,0,0,d,0,0);draw()}
const mh=(M,cls=&#x27;&#x27;)=&gt;`&lt;span class=&quot;mm ${cls}&quot;&gt;${M.flat().map(n=&gt;`&lt;span&gt;${fmt(n)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/span&gt;`;
function draw(){
  const W=cv.clientWidth,u=W/16,X=x=&gt;W/2+x*u,Y=y=&gt;W/2-y*u;
  ctx.clearRect(0,0,W,W);ctx.font=&#x27;11px system-ui&#x27;;
  for(let i=-8;i&lt;=8;i++){
    ctx.strokeStyle=i?col(&#x27;--grid&#x27;):col(&#x27;--axis&#x27;);ctx.lineWidth=i?1:1.5;
    ctx.beginPath();ctx.moveTo(X(i),0);ctx.lineTo(X(i),W);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,Y(i));ctx.lineTo(W,Y(i));ctx.stroke();
    if(i&amp;&amp;i%2===0){ctx.fillStyle=col(&#x27;--mute&#x27;);ctx.fillText(i,X(i)-3,Y(0)+13);ctx.fillText(i,X(0)+4,Y(i)+4)}
  }
  const path=pts=&gt;{ctx.beginPath();pts.forEach((p,i)=&gt;i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.closePath()};
  ctx.lineJoin=&#x27;round&#x27;;
  if(drawing){

  try{history.replaceState(null,'','#'+n+'d')}catch(e){}}
t[2].onclick=()=>show(2);t[3].onclick=()=>show(3);
if(location.hash==='#3d')show(3);
</script></body></html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Transformation Visualizer</title>
<style>
:root{--bg:#eef1f8;--panel:#fff;--ink:#1b2236;--mute:#5f6b85;--line:#d8deec;--grid:#d5dbea;--orig:#8d99b5;--final:#2563eb;--face:#f59e0b;--cS:#7c3aed;--cR:#d97706;--cT:#0d9488;--pivot:#e11d48}
@media(prefers-color-scheme:dark){:root{--bg:#0f1424;--panel:#182038;--ink:#e8ecf8;--mute:#9aa6c6;--line:#2a3558;--grid:#2a3558;--orig:#6d7aa0;--final:#60a5fa;--face:#fbbf24;--cS:#a78bfa;--cR:#fbbf24;--cT:#2dd4bf;--pivot:#fb7185}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:980px;margin:0 auto;padding:0 14px 28px}
header{padding:16px 2px 10px}h1{font-size:1.4rem;margin:0}header p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.layout{display:grid;gap:14px}
@media(min-width:800px){.layout{grid-template-columns:1fr 1fr;align-items:start}.stage{position:sticky;top:12px}}
.card,.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stage{padding:10px}
@media(max-width:799px){.stage{position:sticky;top:0;z-index:5;border-radius:0 0 14px 14px;margin:0 -14px;border-top:0}}
canvas{display:block;width:min(100%,40vh);aspect-ratio:1;margin:0 auto;border-radius:10px;cursor:grab;touch-action:none;background:var(--bg)}
@media(min-width:800px){canvas{width:100%}}
.bar,.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.chips{gap:6px}
.sum{font-size:.86rem;color:var(--mute);margin:6px 2px 0}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
button.go{background:var(--final);border-color:var(--final);color:#fff;font-weight:600}
:focus-visible{outline:3px solid var(--final);outline-offset:2px}
.sw{display:flex;align-items:center;gap:6px;font-size:.88rem;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--final)}
.chip{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:600;border:2px solid var(--c);color:var(--c);min-height:0;background:transparent}
.chip.on{background:var(--c);color:var(--panel)}
.panel{display:grid;gap:12px}
.op{border-left:5px solid var(--c)}
.op h2{display:flex;align-items:center;justify-content:space-between;font-size:1rem;margin:0 0 4px;color:var(--c)}
.op h2 button{min-height:30px;padding:2px 10px;font-size:.8rem}
.row{display:grid;grid-template-columns:22px 1fr 52px;align-items:center;gap:8px}
.row output{text-align:right;font:.85rem ui-monospace,Menlo,monospace;color:var(--mute)}
input[type=range]{width:100%;height:32px;accent-color:var(--c,var(--final))}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.g2 select,.g2 button{width:100%}
h3{margin:12px 0 6px;font-size:.9rem;color:var(--mute)}Each((s,k)=>{
    const c=col('--c'+s.ch),pts=b.map(v=>apply(s.M,v));
    ctx.globalAlpha=.6;ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.setLineDash([3,3]);path(pts);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=c;ctx.font='600 11px system-ui';ctx.fillText(`${k+1}. ${NAME[s.ch]}`,X(pts[0][0])+6,Y(pts[0][1])-6);ctx.globalAlpha=1});
  const M=st[n-1].M,out=b.map(v=>apply(M,v));
  path(out);ctx.fillStyle=col('--final');ctx.globalAlpha=.2;ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=col('--final');ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle=col('--final');out.forEach(p=>{ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),3,0,7);ctx.fill()});
  const pv=pivot();ctx.fillStyle=col('--pivot');ctx.beginPath();ctx.arc(X(pv[0]),Y(pv[1]),5.5,0,7);ctx.fill();
  ctx.strokeStyle=col('--panel');ctx.lineWidth=2;ctx.stroke();
  // challenge score (min over cyclic vertex shifts)
  if(goal){let best=99;const k=out.length;
    for(let s=0;s<k;s++){let d=0;for(let i=0;i<k;i++)d+=Math.hypot(out[i][0]-goal[(i+s)%k][0],out[i][1]-goal[(i+s)%k][1]);best=Math.min(best,d/k)}
    $('goalmsg').textContent=best<.2?'🎯 Solved! Pindutin ang Start para sa bago.':`Match: ${Math.max(0,Math.round(100-best*20))}%`}
  else $('goalmsg').textContent='';
  // matrix panels
  $('mat').innerHTML=M.flat().map(x=>`<span>${fmt(x)}</span>`).join('');
  $('formula').innerHTML='M = '+[...ordArr()].reverse().map(c=>`<span style="color:var(--c${c})">${c}</span>`).join(' · ');
  $('math').innerHTML=st.map((s,i)=>`<div style="color:var(--c${s.ch});font-weight:600;font-size:.85rem">${i+1}. ${NAME[s.ch]}</div><div class="mrow">${mh(s.op)} × ${mh(s.prev)} = ${mh(s.M)}</div>`).join('');
  $('tbl').innerHTML='<tr><th>Vertex</th><th>Before</th><th>After</th></tr>'+b.map((v,i)=>`<tr><td>V${i+1}</td><td>(${fmt(v[0])}, ${fmt(v[1])})</td><td>(${fmt(out[i][0])}, ${fmt(out[i][1])})</td></tr>`).join('');
}
function ui(){
  ids.forEach(id=>{$(id).value=P[id];$(id).nextElementSibling.textContent=id==='r'?Math.round(P[id])+'°':(+P[id]).toFixed(1)});
  const o=ordArr(),on=prog===null?-1:Math.min(o.length-1,Math.floor(prog));
  $('chips').innerHTML=o.map((c,i)=>`<span class="chip ${i===on?'on':''}" style="--c:var(--c${c})">${i+1}. ${NAME[c]}</span>`).join('');
  if(drawing)return;
  const t={S:`scale ${P.sx.toFixed(1)}×/${P.sy.toFixed(1)}×`,H:`shear (${P.hx.toFixed(1)}, ${P.hy.toFixed(1)})`,R:`rotate ${Math.round(P.r)}°`,T:`move (${P.tx.toFixed(1)}, ${P.ty.toFixed(1)})`};
  const idn={S:P.sx===1&&P.sy===1,H:!P.hx&&!P.hy,R:!P.r,T:!P.tx&&!P.ty};
  const parts=o.filter(c=>c!=='M'&&!idn[c]).map(c=>t[c]);
  $('sum').textContent=useMat()?'Gamit ang sarili mong matrix.':parts.length?'Ginagawa: '+parts.join(', then ')+'.':'Walang transformation pa. Galawin ang sliders o i-drag ang shape.';
}
const refresh=()=>{ui();draw()};
function stop(){if(raf)cancelAnimationFrame(raf);raf=null;prog=null;$('play').textContent='▶ Play steps'}
const change=()=>{stop();refresh()};

ids.forEach(id=>$(id).addEventListener('input',()=>{P[id]=+$(id).value;if($('lock').checked&&(id==='sx'||id==='sy'))P.sx=P.sy=P[id];change()}));
document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.reset;
  if(k==='T')Object.assign(P,{tx:0,ty:0});if(k==='S')Object.assign(P,{sx:1,sy:1});if(k==='H')Object.assign(P,{hx:0,hy:0});if(k==='R')P.r=0;change()});
$('reset').onclick=()=>{P={...ID};change()};
['shape','order','pivot','steps','usemat'].forEach(i=>$(i).onchange=change);
$('lock').onchange=()=>{if($('lock').checked){P.sy=P.sx;change()}};
perms('SHRT').forEach(o=>{const e=document.createElement('option');e.value=o;e.textContent='Order: '+[...o].map(c=>NAME[c]).join(' → ');$('order').appendChild(e)});
PRESETS.forEach(([n,v])=>{const b=document.createElement('button');b.className='chip';b.style.setProperty('--c','var(--mute)');b.textContent=n;b.onclick=()=>{Object.assign(P,v);change()};$('presets').appendChild(b)});
// own-matrix grid
[1,0,0,0,1,0].forEach((v,i)=>{const e=document.createElement('input');e.className='mi';e.type='number';e.step='0.1';e.value=v;e.setAttribute('aria-label','matrix cell '+i);e.oninput=change;$('mg').appendChild(e)});
[0,0,1].forEach(v=>{const e=document.createElement('span');e.className='mi fx';e.textContent=v;$('mg').appendChild(e)});
$('fill').onclick=()=>{const m=mats(P);let M=I3();for(const c of $('order').value)M=mul(m[c],M);
  document.querySelectorAll('.mi').forEach((e,i)=>e.value=+fmt(M[Math.floor(i/3)][i%3]));change()};
// play
$('play').onclick=()=>{
  if(raf){stop();refresh();return}
  const t0=performance.now(),D=1500,N=ordArr().length;$('play').textContent='■ Stop';
  const tick=now=>{const t=(now-t0)/D;if(t>=N){stop();refresh();return}prog=t;ui();draw();raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
};
// challenge
$('chal').onclick=()=>{
  stop();const L=+$('lvl').value,ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
  const T={...ID,tx:ri(-4,4)||2,ty:ri(-4,4)||-2};
  if(L>=2)T.r=pick([-120,-90,-60,-45,45,60,90,120,150]);
  if(L>=3){T.sx=T.sy=pick([.5,.75,1.5,2])}
  const M=(()=>{const m=mats(T);let X=I3();for(const c of $('order').value)X=mul(m[c],X);return X})();
  goal=base().map(v=>apply(M,v));P={...ID};
  if(useMat())$('usemat').checked=false;change();
};
// export
$('png').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='transformation.png';a.click()});
$('copy').onclick=async()=>{const M=stages(P).pop().M,t=M.map(r=>r.map(fmt).join('  ')).join('\n');
  try{await navigator.clipboard.writeText(t);$('copy').textContent='✓ Copied'}catch(e){$('copy').textContent='Hindi ma-copy'}setTimeout(()=>$('copy').textContent='⧉ Copy matrix',1500)};
// draw own shape
$('draw').onclick=()=>{drawing=!drawing;
  if(drawing){cust=[];$('shape').value='custom';stop()}
  $('draw').textContent=drawing?'✔ Done drawing':'✎ Draw own shape';
  if(drawing&&false)return;refresh();if(!drawing&&cust.length<3)$('sum').textContent='Kulang ang points, kaya F muna ang gamit.'};
// pointer: draw points / drag pivot / drag shape
let last=null,dragPv=false;
const world=e=>{const r=cv.getBoundingClientRect(),W=r.width,u=W/16;return[(e.clientX-r.left-W/2)/u,-(e.clientY-r.top-W/2)/u]};
cv.addEventListener('pointerdown',e=>{
  const w=world(e);
  if(drawing){cust.push([Math.round(w[0]*2)/2,Math.round(w[1]*2)/2]);draw();return}
  stop();const pv=pivot(),u=cv.clientWidth/16;
  dragPv=$('pivot').value==='x'&&Math.hypot(w[0]-pv[0],w[1]-pv[1])*u<18;
  last=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!last)return;const u=cv.clientWidth/16,dx=(e.clientX-last[0])/u,dy=-(e.clientY-last[1])/u;last=[e.clientX,e.clientY];
  if(dragPv){const w=world(e);cp=[Math.round(clamp(w[0],-8,8)*10)/10,Math.round(clamp(w[1],-8,8)*10)/10]}
  else{P.tx=Math.round(clamp(P.tx+dx,-6,6)*10)/10;P.ty=Math.round(clamp(P.ty+dy,-6,6)*10)/10}
  refresh()});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{last=null;dragPv=false;cv.style.cursor='grab'}));
addEventListener('resize',fit);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
ui();fit();
</script>
</body>
</html>

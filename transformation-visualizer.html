<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformation Visualizer</title>
<style>
:root{--bg:#eef1f8;--panel:#fff;--ink:#1b2236;--mute:#5f6b85;--line:#d8deec;--on:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1424;--panel:#182038;--ink:#e8ecf8;--mute:#9aa6c6;--line:#2a3558;--on:#60a5fa}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.top b{font-size:1rem;white-space:nowrap}
.seg{display:flex;margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:600;color:var(--mute);background:transparent;border:0;border-radius:9px;padding:8px 16px;min-height:40px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--on);color:#fff}
.seg button:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.frames{position:relative;flex:1;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe.off{visibility:hidden;pointer-events:none}
@media(max-width:520px){.top b{display:none}.seg{margin:0 auto;width:100%}.seg button{flex:1}}
</style></head>
<body>
<div class="top"><b>Transformation Visualizer</b>
<div class="seg" role="tablist" aria-label="Choose 2D or 3D">
<button role="tab" id="t2" aria-selected="true">2D · 3×3</button><button role="tab" id="t3" aria-selected="false">3D · 4×4</button></div></div>
<div class="frames">
<iframe id="f2" title="2D transformation visualizer" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;Transformation Visualizer&lt;/title&gt;
&lt;style&gt;
:root{--bg:#eef1f8;--panel:#fff;--ink:#1b2236;--mute:#5f6b85;--line:#d8deec;--grid:#e3e8f3;--axis:#9aa6c2;--orig:#8d99b5;--final:#2563eb;--cS:#7c3aed;--cH:#c026d3;--cR:#d97706;--cT:#0d9488;--cM:#2563eb;--pivot:#e11d48;--goal:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1424;--panel:#182038;--ink:#e8ecf8;--mute:#9aa6c6;--line:#2a3558;--grid:#222b48;--axis:#56628a;--orig:#6d7aa0;--final:#60a5fa;--cS:#a78bfa;--cH:#e879f9;--cR:#fbbf24;--cT:#2dd4bf;--cM:#60a5fa;--pivot:#fb7185;--goal:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif}
.app{max-width:980px;margin:0 auto;padding:0 14px 28px}
header{padding:16px 2px 10px}h1{font-size:1.4rem;margin:0}header p{margin:2px 0 0;color:var(--mute);font-size:.92rem}
.layout{display:grid;gap:14px}urn}
  const t0=performance.now(),D=1500,N=ordArr().length;$('play').textContent='■ Stop';
  const tick=now=>{const t=(now-t0)/D;if(t>=N){stop();refresh();return}prog=t;ui();draw();raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
};
// challenge
$('chal').onclick=()=>{
  stop();const L=+$('lvl').value,ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
  const T={...ID,tx:ri(-4,4)||2,ty:ri(-4,4)||-2};
  if(L>=2)T.r=pick([-120,-90,-60,-45,45,60,90,120,150]);
  if(L>=3){T.sx=T.sy=pick([.5,.75,1.5,2])}
  const M=(()=>{const m=mats(T);let X=I3();for(const c of $('order').value)X=mul(m[c],X);return X})();
  goal=base().map(v=>apply(M,v));P={...ID};
  if(useMat())$('usemat').checked=false;change();
};
// export
$('png').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='transformation.png';a.click()});
$('copy').onclick=async()=>{const M=stages(P).pop().M,t=M.map(r=>r.map(fmt).join('  ')).join('\n');
  try{await navigator.clipboard.writeText(t);$('copy').textContent='✓ Copied'}catch(e){$('copy').textContent='Hindi ma-copy'}setTimeout(()=>$('copy').textContent='⧉ Copy matrix',1500)};
// draw own shape
$('draw').onclick=()=>{drawing=!drawing;
  if(drawing){cust=[];$('shape').value='custom';stop()}
  $('draw').textContent=drawing?'✔ Done drawing':'✎ Draw own shape';
  if(drawing&&false)return;refresh();if(!drawing&&cust.length<3)$('sum').textContent='Kulang ang points, kaya F muna ang gamit.'};
// pointer: draw points / drag pivot / drag shape
let last=null,dragPv=false;
const world=e=>{const r=cv.getBoundingClientRect(),W=r.width,u=W/16;return[(e.clientX-r.left-W/2)/u,-(e.clientY-r.top-W/2)/u]};
cv.addEventListener('pointerdown',e=>{
  const w=world(e);
  if(drawing){cust.push([Math.round(w[0]*2)/2,Math.round(w[1]*2)/2]);draw();return}
  stop();const pv=pivot(),u=cv.clientWidth/16;
  dragPv=$('pivot').value==='x'&&Math.hypot(w[0]-pv[0],w[1]-pv[1])*u<18;
  last=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{
  if(!last)return;const u=cv.clientWidth/16,dx=(e.clientX-last[0])/u,dy=-(e.clientY-last[1])/u;last=[e.clientX,e.clientY];
  if(dragPv){const w=world(e);cp=[Math.round(clamp(w[0],-8,8)*10)/10,Math.round(clamp(w[1],-8,8)*10)/10]}
  else{P.tx=Math.round(clamp(P.tx+dx,-6,6)*10)/10;P.ty=Math.round(clamp(P.ty+dy,-6,6)*10)/10}
  refresh()});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{last=null;dragPv=false;cv.style.cursor='grab'}));
addEventListener('resize',fit);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
ui();fit();
</script>
</body>
</html>
